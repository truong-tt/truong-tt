  <!-- sea of cloud pooling in the valleys -->
  <g fill="#f0dcd0" opacity=".26">
    <ellipse cx="300" cy="392" rx="240" ry="16"/>
    <ellipse cx="720" cy="378" rx="200" ry="13"/>
    <ellipse cx="1150" cy="386" rx="260" ry="15"/>
  </g>

  <!-- foreground bank -->
  <path fill="#05070f" d="M0 460 L0 432 C 140 420 260 438 400 430 C 560 420 700 442 860 434
    C 1020 426 1180 444 1340 434 C 1450 428 1530 438 1600 432 L1600 460 Z"/>
  <g fill="#05070f">
    <path d="M120 434 C 118 404 112 384 96 364 C 118 384 130 406 134 434 Z"/>
    <path d="M186 434 C 190 400 200 380 222 358 C 204 384 198 408 198 434 Z"/>
    <path d="M470 434 C 474 398 486 374 510 352 C 490 380 482 406 482 434 Z"/>
    <path d="M536 434 C 532 404 524 384 506 364 C 530 384 546 406 550 434 Z"/>
    <path d="M980 434 C 976 400 966 378 946 358 C 972 378 990 404 996 434 Z"/>
    <path d="M1250 434 C 1254 398 1266 374 1290 352 C 1270 380 1262 406 1262 434 Z"/>
    <path d="M1420 434 C 1416 404 1408 382 1388 362 C 1414 382 1432 406 1436 434 Z"/>
  </g>

  <rect width="1600" height="460" fill="url(#scrim)"/>

  <text x="76" y="150" font-family="ui-monospace,Consolas,'SF Mono',monospace" font-size="15"
        letter-spacing="4.5" fill="#ffb066">05:41 · FIRST LIGHT</text>
  <text x="74" y="238" font-family="ui-sans-serif,'Segoe UI',-apple-system,'Helvetica Neue',Roboto,sans-serif"
        font-weight="700" font-size="70" letter-spacing="-2" fill="#fdf4e6">Trần Thế Trường</text>
  <text x="76" y="288" font-family="ui-sans-serif,'Segoe UI',system-ui,sans-serif" font-size="22"
        fill="#fdf4e6" fill-opacity=".72">Clinical machine learning, built in Vietnam</text>
  <text x="76" y="332" font-family="ui-sans-serif,'Segoe UI',system-ui,sans-serif" font-size="19"
        fill="#ffb066" fill-opacity=".9">The machine takes the load. The person keeps the judgement.</text>
</svg>
