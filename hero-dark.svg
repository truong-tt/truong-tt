<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" width="1600" height="460" role="img" aria-label="Dawn breaking over layered mountain ridges and a sea of cloud, with the name Tran The Truong">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#141f45"/>
      <stop offset=".38"  stop-color="#4b2f5c"/>
      <stop offset=".66"  stop-color="#9c4a63"/>
      <stop offset="1"    stop-color="#f4a05a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0"   stop-color="#fff0cf" stop-opacity="1"/>
      <stop offset=".16" stop-color="#ffc27a" stop-opacity=".72"/>
      <stop offset=".52" stop-color="#f4834a" stop-opacity=".26"/>
      <stop offset="1"   stop-color="#f4834a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0854a"/><stop offset="1" stop-color="#8d4a49"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a75f5f"/><stop offset="1" stop-color="#5d3a55"/>
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4560"/><stop offset="1" stop-color="#37294c"/>
    </linearGradient>
    <linearGradient id="r4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2c50"/><stop offset="1" stop-color="#1b1936"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0f22" stop-opacity=".92"/>
      <stop offset=".38" stop-color="#0a0f22" stop-opacity=".66"/>
      <stop offset=".68" stop-color="#0a0f22" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="460" fill="url(#sky)"/>

  <g fill="#dfe8ff">
    <circle cx="180" cy="52"  r="1.6" opacity=".8"/><circle cx="420" cy="34" r="1.3" opacity=".6"/>
    <circle cx="640" cy="70"  r="1.5" opacity=".7"/><circle cx="880" cy="40" r="1.2" opacity=".5"/>
    <circle cx="1120" cy="62" r="1.6" opacity=".7"/><circle cx="1330" cy="30" r="1.3" opacity=".6"/>
    <circle cx="1480" cy="78" r="1.4" opacity=".5"/><circle cx="300" cy="104" r="1.2" opacity=".45"/>
  </g>

  <circle cx="1180" cy="286" r="230" fill="url(#sunGlow)"/>
  <circle cx="1180" cy="286" r="21" fill="#fff3da"/>

  <!-- ridges, far to near -->
  <path fill="url(#r4)" d="M0 316 C 150 292 260 320 400 306 C 540 292 660 262 800 276
    C 940 290 1050 268 1190 258 C 1330 248 1460 274 1600 262 L1600 460 L0 460 Z"/>
  <path fill="url(#r3)" d="M0 344 C 130 330 240 356 380 342 C 520 328 640 300 790 316
