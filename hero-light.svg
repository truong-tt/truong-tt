<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="A hospital corridor at dawn, morning light through the window at the end, with the name Tran The Truong">
  <defs>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6e0d4"/><stop offset="1" stop-color="#cdc5b6"/>
    </linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#e6e0d4"/><stop offset="1" stop-color="#d3cbbc"/>
    </linearGradient>
    <linearGradient id="floorG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#dbd4c6"/><stop offset="1" stop-color="#efe9df"/>
    </linearGradient>
    <radialGradient id="dawn">
      <stop offset="0" stop-color="#fff7ea" stop-opacity="1"/>
      <stop offset=".4" stop-color="#f5c48d" stop-opacity=".6"/>
      <stop offset="1" stop-color="#f5c48d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool">
      <stop offset="0" stop-color="#ffe6c2" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffe6c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f0e7" stop-opacity=".96"/>
      <stop offset=".34" stop-color="#f4f0e7" stop-opacity=".78"/>
      <stop offset=".62" stop-color="#f4f0e7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="#f4f0e7"/>

  <polygon points="0,0 1200,0 860,150 700,150" fill="#e9e3d7"/>
  <polygon points="0,420 1200,420 860,215 700,215" fill="url(#floorG)"/>
  <polygon points="0,0 700,150 700,215 0,420" fill="url(#wallL)"/>
  <polygon points="1200,0 860,150 860,215 1200,420" fill="url(#wallR)"/>
  <rect x="700" y="150" width="160" height="65" fill="#e3ddd0"/>

  <polygon points="1098,132.8 1057.2,138.9 1057.2,333.9 1098,358.5" fill="#b6ae9e"/>
  <polygon points="1023.2,143.9 989.2,149 989.2,292.9 1023.2,313.4" fill="#bdb5a5"/>
  <polygon points="962,153 934.8,157.1 934.8,260.1 962,276.5" fill="#c4bcac"/>
  <polygon points="245,135.3 322,140.9 322,325.7 245,348.2" fill="#b6ae9e"/>

  <polygon points="0,285.6 700,194.2 700,197.4 0,290" fill="#a9a091" opacity=".75"/>
  <polygon points="1200,285.6 860,194.2 860,197.4 1200,290" fill="#a9a091" opacity=".75"/>

  <!-- morning, arriving through the window at the end -->
  <rect x="736" y="162" width="88" height="44" fill="#fff8ec"/>
  <rect x="779" y="162" width="2" height="44" fill="#cdc5b6"/>
  <rect x="736" y="183" width="88" height="2" fill="#cdc5b6"/>
  <circle cx="780" cy="184" r="190" fill="url(#dawn)"/>
  <ellipse cx="790" cy="330" rx="290" ry="78" fill="url(#pool)"/>

  <rect width="1200" height="420" fill="url(#scrim)"/>

  <text x="72" y="150" font-family="ui-monospace,Consolas,'SF Mono',monospace" font-size="15"
        letter-spacing="4.5" fill="#a8542f">06:02 · SÁNG</text>
  <text x="70" y="240" font-family="ui-serif,'Palatino Linotype',Palatino,Georgia,serif"
        font-size="74" fill="#14161a">Trần Thế Trường</text>
  <text x="72" y="286" font-family="ui-sans-serif,'Segoe UI',system-ui,sans-serif" font-size="21"
        fill="#14161a" fill-opacity=".70">Machine learning for clinical work in Vietnam</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="trace" d="M72 344 L128 344 L140 328 L152 360 L164 344 L214 344 L226 328 L238 360 L250 344
                        L316 344 L328 337 L340 351 L352 344 L392 344 L404 326 L416 362 L428 344 L484 344"
          stroke="#14161a" stroke-opacity=".2" stroke-width="1.6"/>
    <use href="#trace" stroke="#c2593f" stroke-width="2.1" stroke-dasharray="46 460" stroke-dashoffset="506">
      <animate attributeName="stroke-dashoffset" from="506" to="0" dur="3.4s" repeatCount="indefinite"/>
    </use>
  </g>
</svg>
