<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" width="1600" height="460" role="img" aria-label="Full morning over layered mountain ridges and a sea of cloud, with the name Tran The Truong">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#3f7fb4"/>
      <stop offset=".38"  stop-color="#8fb6d4"/>
      <stop offset=".66"  stop-color="#d9c3ae"/>
      <stop offset="1"    stop-color="#ffd9a4"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset=".16" stop-color="#fff0cd" stop-opacity=".78"/>
      <stop offset=".52" stop-color="#ffd9a0" stop-opacity=".30"/>
      <stop offset="1"   stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7b49c"/><stop offset="1" stop-color="#9aa7b6"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c4d0"/><stop offset="1" stop-color="#6f7f92"/>
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c9db0"/><stop offset="1" stop-color="#5b6d84"/>
    </linearGradient>
    <linearGradient id="r4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c90a6"/><stop offset="1" stop-color="#4e6178"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2efe7" stop-opacity=".93"/>
      <stop offset=".38" stop-color="#f2efe7" stop-opacity=".70"/>
      <stop offset=".68" stop-color="#f2efe7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="460" fill="url(#sky)"/>

  

  <circle cx="1180" cy="286" r="230" fill="url(#sunGlow)"/>
  <circle cx="1180" cy="286" r="21" fill="#ffffff"/>

  <!-- ridges, far to near -->
  <path fill="url(#r4)" d="M0 316 C 150 292 260 320 400 306 C 540 292 660 262 800 276
    C 940 290 1050 268 1190 258 C 1330 248 1460 274 1600 262 L1600 460 L0 460 Z"/>
  <path fill="url(#r3)" d="M0 344 C 130 330 240 356 380 342 C 520 328 640 300 790 316
    C 930 330 1060 312 1200 300 C 1340 288 1470 316 1600 300 L1600 460 L0 460 Z"/>
  <path fill="url(#r2)" d="M0 372 C 160 358 300 388 450 372 C 600 356 700 330 850 348
    C 990 364 1120 348 1270 338 C 1400 330 1500 352 1600 342 L1600 460 L0 460 Z"/>
  <path fill="url(#r1)" d="M0 404 C 180 392 320 416 470 402 C 620 388 760 362 910 382
    C 1050 400 1180 388 1330 378 C 1450 370 1530 386 1600 380 L1600 460 L0 460 Z"/>

  <!-- sea of cloud pooling in the valleys -->
  <g fill="#ffffff" opacity=".30">
    <ellipse cx="300" cy="392" rx="240" ry="16"/>
    <ellipse cx="720" cy="378" rx="200" ry="13"/>
    <ellipse cx="1150" cy="386" rx="260" ry="15"/>
  </g>

  <!-- foreground bank -->
  <path fill="#243347" d="M0 460 L0 432 C 140 420 260 438 400 430 C 560 420 700 442 860 434
    C 1020 426 1180 444 1340 434 C 1450 428 1530 438 1600 432 L1600 460 Z"/>
  <g fill="#243347">
    <path d="M120 434 C 118 404 112 384 96 364 C 118 384 130 406 134 434 Z"/>
    <path d="M186 434 C 190 400 200 380 222 358 C 204 384 198 408 198 434 Z"/>
    <path d="M470 434 C 474 398 486 374 510 352 C 490 380 482 406 482 434 Z"/>
    <path d="M536 434 C 532 404 524 384 506 364 C 530 384 546 406 550 434 Z"/>
    <path d="M980 434 C 976 400 966 378 946 358 C 972 378 990 404 996 434 Z"/>
    <path d="M1250 434 C 1254 398 1266 374 1290 352 C 1270 380 1262 406 1262 434 Z"/>
    <path d="M1420 434 C 1416 404 1408 382 1388 362 C 1414 382 1432 406 1436 434 Z"/>
  </g>

  <rect width="1600" height="460" fill="url(#scrim)"/>

  <text x="76" y="150" font-family="ui-monospace,Consolas,'SF Mono',monospace" font-size="15"
        letter-spacing="4.5" fill="#b06a2c">06:12 · FULL LIGHT</text>
  <text x="74" y="238" font-family="ui-sans-serif,'Segoe UI',-apple-system,'Helvetica Neue',Roboto,sans-serif"
        font-weight="700" font-size="70" letter-spacing="-2" fill="#131a26">Trần Thế Trường</text>
  <text x="76" y="288" font-family="ui-sans-serif,'Segoe UI',system-ui,sans-serif" font-size="22"
        fill="#131a26" fill-opacity=".72">Clinical machine learning, built in Vietnam</text>
  <text x="76" y="332" font-family="ui-sans-serif,'Segoe UI',system-ui,sans-serif" font-size="19"
        fill="#a85f28" fill-opacity=".95">The machine takes the load. The person keeps the judgement.</text>
</svg>
